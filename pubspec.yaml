name: inventory_app
description: A minimalistic inventory management system UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  assets:
    - .env
    - assets/images/
  uses-material-design: true
